{% extends "auth/_auth_base.html" %}
{% block title %}Forgot password — StudyMind AI{% endblock %}
{% block auth_content %}
<h2 class="text-center">Reset your password</h2>
<p class="text-center text-sm">Enter your email and we'll send you a reset link.</p>

<form method="POST" action="{{ url_for('auth.forgot_password') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>
  </div>
  <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
</form>

<p class="text-center text-sm mt-24"><a href="{{ url_for('auth.login') }}" style="color:var(--brand-1);font-weight:600;">Back to login</a></p>
{% endblock %}
