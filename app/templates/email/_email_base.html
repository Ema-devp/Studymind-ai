<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0; padding:0; background:#0B0B14; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0B0B14; padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#12121E; border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,0.08);">
        <tr><td style="padding:28px 32px 0;">
          <div style="display:inline-block; width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#7C5CFF,#38D9C9); text-align:center; line-height:32px; color:#0B0B14; font-weight:800; font-size:16px;">S</div>
          <span style="color:#F3F2FA; font-weight:800; font-size:16px; margin-left:8px; vertical-align:middle;">StudyMind AI</span>
        </td></tr>
        <tr><td style="padding:24px 32px 32px; color:#A7A5BC; font-size:14px; line-height:1.6;">
          {% block email_body %}{% endblock %}
        </td></tr>
      </table>
      <p style="color:#6E6C86; font-size:12px; margin-top:20px;">StudyMind AI · This is an automated message.</p>
    </td></tr>
  </table>
</body>
</html>
